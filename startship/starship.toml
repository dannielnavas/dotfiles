# Estilo Warp: prompt minimo en 2 lineas.
# Linea 1: carpeta + git (+ runtime solo si el proyecto lo necesita)
# Linea 2: ❯ limpia. Sin fill, sin AWS/Docker/Jobs, sin status bar.

format = """
$directory\
$git_branch\
$git_status\
$python\
$nodejs\
$rust\
$golang\
$cmd_duration\
$line_break\
$character"""

add_newline = true
palette = "warp"

# ---------------------------------------------------------------------------
# Directorio: claro y neutral (Warp usa blanco/gris, no azul del Nord)
# ---------------------------------------------------------------------------
[directory]
style = 'bold fg:text'
format = '[$path]($style) '
truncation_length = 4
truncation_symbol = '…/'
truncate_to_repo = true

# ---------------------------------------------------------------------------
# Git: rama en gris acento, sin "on", sin icono
# ---------------------------------------------------------------------------
[git_branch]
style = 'fg:muted'
symbol = ''
format = '[($branch )]($style)'

[git_status]
style = 'fg:muted'
format = '[$modified$staged$ahead_behind]($style) '
modified = '*'
staged = '+'
untracked = ''
ahead = ' ↑$count'
behind = ' ↓$count'
diverged = ' ⇅ $ahead_behind_count'

# ---------------------------------------------------------------------------
# Runtimes: solo si el proyecto los requiere (Starship ya detecta por archivos)
# ---------------------------------------------------------------------------
[python]
style = 'fg:muted'
symbol = ''
format = '[$version ]($style)'
pyenv_version_name = false

[nodejs]
style = 'fg:muted'
symbol = ''
format = '[$version ]($style)'

[rust]
style = 'fg:muted'
symbol = ''
format = '[$version ]($style)'

[golang]
style = 'fg:muted'
symbol = ''
format = '[$version ]($style)'

[lua]
format = '[$version ]($style)'
symbol = ''

[haskell]
style = 'fg:muted'
symbol = ''
format = '[$version ]($style)'

[ruby]
style = 'fg:muted'
symbol = ''
format = '[$version ]($style)'

# Desactivados en Warp: ruido constante aunque poco usado
[aws]
disabled = true

[docker_context]
disabled = true

[jobs]
disabled = true

# ---------------------------------------------------------------------------
# Duracion: solo comandos largos (>2s), en gris tenue
# ---------------------------------------------------------------------------
[cmd_duration]
min_time = 2000
style = 'fg:muted'
format = '[$duration ]($style)'

# ---------------------------------------------------------------------------
# Indicador: ❯ estilo Warp (acento brillante / rojo en error)
# ---------------------------------------------------------------------------
[character]
success_symbol = '[❯](bold fg:accent) '
error_symbol = '[❯](bold fg:red) '

# ---------------------------------------------------------------------------
# Paleta suave estilo Warp (Tokyo Night, sin Nord saturado)
# ---------------------------------------------------------------------------
[palettes.warp]
text = '#c0caf5'
muted = '#565f89'
accent = '#7aa2f7'
red = '#f7768e'
